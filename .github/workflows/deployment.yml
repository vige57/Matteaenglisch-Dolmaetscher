name: Deploy PWA to GitHub Pages

on:
  # Orchestrierung: Hört auf den Abschluss der Auto-Version-Action
  workflow_run:
    workflows: ["Auto Version Bump"]
    types:
      - completed
  workflow_dispatch: 

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Sicherheitscheck: Führt das Deployment nur aus, wenn der vorherige Workflow erfolgreich war 
    # (oder wenn es manuell per Button gestartet wurde)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PWA Folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: './src'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4