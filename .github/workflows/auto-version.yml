name: Auto Version Bump

on:
  push:
    branches:
      - main
    paths:
      - 'src/**' #Startet nur, wenn im src-Ordner echter App-Code geändert wird
  workflow_dispatch:

jobs:
  bump-version:
    # Verhindert, dass der Workflow läuft, wenn der Commit bereits ein automatischer Bump war
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Bump version based on src/sw.js
        id: bump
        run: |
          # Extrahiert die Version aus der Zeile: const VERSION = 'x.y.z'; aus src/sw.js
          OLD_VERSION=$(grep "const VERSION =" src/sw.js | sed -E "s/.*'(.+)'.*/\1/")
          echo "Old version from src/sw.js: $OLD_VERSION"
          
          # Version erhöhen
          NEW_VERSION=$(echo $OLD_VERSION | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')
          echo "New version: $NEW_VERSION"
          
          # 1. Zurückschreiben in src/sw.js
          sed -i "s/const VERSION = '$OLD_VERSION'/const VERSION = '$NEW_VERSION'/" src/sw.js
          
          # 2. Synchronisieren in src/manifest.json
          jq ".version = \"$NEW_VERSION\"" src/manifest.json > temp.json && mv temp.json src/manifest.json

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/manifest.json src/sw.js
          git commit -m "chore: auto-bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push