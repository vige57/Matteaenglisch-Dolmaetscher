<!doctype html>
<html lang="de">
<head>

  <title>Offline — Matteänglisch‑Dolmetscher</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#fdfaf5;color:#1a2e4a;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;padding:2rem}
